<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMon | Farm Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --header-bg: #d5edc9;
            --main-bg: #7ba86d;
            --panel-bg: #eafaf1;
            --text-dark: #2c3e50;
            --indicator-bg: #d5edc9;
            --danger-bg: #ff9999;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--main-bg);
            margin: 0;
            overflow-x: hidden;
        }

        /* 导航栏 */
        .header {
            background-color: var(--header-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }

        .header-left { display: flex; align-items: center; gap: 40px; }
        .logo { width: 45px; height: 45px; cursor: pointer; }
        
        .nav-links {
            display: flex;
            gap: 30px;
            position: absolute; /* 使用绝对定位强制居中 */
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: bold; font-size: 18px; }

        .header-right { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .user-avatar { width: 45px; height: 45px; background: #eee; border-radius: 50%; border: 2px solid white; }

        /* 布局容器 */
        .main-content {
            display: flex;
            flex: 1;
            justify-content: center; 
            align-items: flex-start; /* 左右两列顶部对齐 */
            padding: 60px 40px;      
            gap: 40px;               
            max-width: 1300px;
            margin: 0 auto;
        }

        /* 左侧部分 */
        .farm-section {
            flex: 0 0 auto; 
        }

        .farm-title {
            color: white;
            font-size: 42px;
            margin: 0 0 20px 0; 
            font-weight: bold;
            line-height: 1;    
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 140px);
            grid-template-rows: repeat(3, 140px);
            gap: 15px;
        }

        .plot-cell {
            background-color: #8b5a2b;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            position: relative;
        }
        .plot-cell:hover { transform: scale(1.03); background-color: #9c6b3c; }
        .plot-cell img { width: 55%; height: auto; }
        
        /* 地块编号角标小标签 */
        .plot-id-tag {
            position: absolute;
            bottom: 5px;
            font-size: 10px;
            color: #f1c40f;
            font-family: monospace;
        }

        /* 右侧详情面板 */
        .right-panel {
            flex: 0 0 380px;
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin: 0;
        }

        .crop-header { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 15px; 
            margin-top: 0; 
        }
        .crop-header img { width: 50px; height: 50px; object-fit: contain; }
        .crop-header h2 { font-size: 32px; margin: 0; line-height: 1; }
        .crop-desc { font-size: 15px; line-height: 1.4; color: #333; margin-bottom: 25px; }

        .indicators-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .indicator {
            background-color: var(--indicator-bg);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
        }
        .indicator.danger { background-color: var(--danger-bg); }

        .footer-note {
            position: fixed;
            bottom: 20px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 14px;
        }
        .soil-sample { width: 25px; height: 25px; background: #8b5a2b; border-radius: 4px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <img src="assets/images/logo_agrimon.jpeg" class="logo" onclick="location.href='about.html'">
            <div class="nav-links">
                <a href="farmer_farmlist.html">Farm List <i class="fas fa-chevron-down"></i></a>
                <a href="farmer_monitor.html">Monitoring Page</a>
                <a href="farmer_manage.html">Task List <i class="fas fa-chevron-down"></i></a>
            </div>
        </div>
        <div class="header-right" onclick="location.href='farmer_profile.html'">
            <div class="user-meta" style="text-align: right; margin-right: 10px;">
                <strong id="navName">Username</strong><br>
                <small id="navID">ID: FETCHING...</small>
            </div>
            <img src="assets/images/user_image.jpg" class="user-avatar">
        </div>
    </header>

    <div class="main-content">
        <div class="farm-section">
            <h1 class="farm-title">Loading...</h1>
            <div class="grid-3x3" id="plotGrid">
                <p style="color: white; grid-column: 1/-1; text-align: center;">Loading 3x3 grid from Java...</p>
            </div>
        </div>
    
        <div class="right-panel">
            <div class="crop-header">
                <img src="assets/images/corn.png" alt="crop" id="panelCropImg">
                <h2 id="cropTitle">Corn</h2>
                <i class="fas fa-info-circle" style="margin-left: auto; color: #999;"></i>
            </div>
            <p class="crop-desc" id="panelCropDesc">
                Loading description...
            </p>

            <div class="indicators-grid">
                <div class="indicator" id="panelGrowth"><i class="far fa-clock"></i> Growth: --</div>
                <div class="indicator" id="panelSunlight"><i class="fas fa-sun"></i> Sunlight: --</div>
                <div class="indicator" id="panelTemp"><i class="fas fa-thermometer-half"></i> Temp: --</div>
                <div class="indicator" id="panelWind"><i class="fas fa-wind"></i> Wind: --</div>
                <div class="indicator" id="panelMoisture"><i class="fas fa-tint"></i> Moisture: --</div>
                <div class="indicator" id="panelCondition"><i class="fas fa-plus"></i> Condition: --</div>
                <div class="indicator danger" id="panelPest"><i class="fas fa-bug"></i> Pest: --</div>
                <div class="indicator danger" id="panelWeed"><i class="fas fa-biohazard"></i> Weed: --</div>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <div class="soil-sample"></div> = one acre of land
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 初始化顶部栏个人信息
            const storedName = localStorage.getItem('real_user_name') || "wfevj";
            document.getElementById('navName').innerText = storedName;

            // 2. 🚀【防错位核心修复】：兼容读取名字，并自动推导正确的后端 ID！
            let currentFarmName = localStorage.getItem('current_farm_name') || localStorage.getItem('current_farm') || "Farm 1";
            let currentFarmId = localStorage.getItem('current_farm_id') || "F-001-1";

            // 强行校准：防止上一个页面没传正确的 ID，导致永远拿着旧 ID 去查数据
            if (currentFarmName.includes("1")) currentFarmId = "F-001-1";
            else if (currentFarmName.includes("2")) currentFarmId = "F-001-2";
            else if (currentFarmName.includes("3")) currentFarmId = "F-001-3";

            // 重新把校准后的干净数据写回记事本，彻底消灭穿帮
            localStorage.setItem('current_farm_id', currentFarmId);
            localStorage.setItem('current_farm_name', currentFarmName);
            localStorage.setItem('current_farm', currentFarmName);

            const titleElement = document.querySelector('.farm-title'); 
            if (titleElement) titleElement.innerText = currentFarmName;

            const plotGrid = document.getElementById('plotGrid');

            // ==================== ✨ 本地图标映射表 ✨ ====================
            const cropIconMap = {
                'Corn': 'assets/images/corn.png',
                'Durian': 'assets/images/durian.png',
                'Paddy': 'assets/images/paddy.png',
                'Banana': 'assets/images/banana.png',
                'Chili': 'assets/images/chili.png',
                'Cocoa': 'assets/images/coco.png',
                'Oil Palm': 'assets/images/oilpalm.png',
                'Pineapple': 'assets/images/pineapple.png'
            };
            const defaultIcon = 'assets/images/corn.png';
            // =============================================================

            // 3. 拿着校准后的真 ID 奔向 Node.js 中端
            fetch(`http://localhost:3000/api/farmer/plots?farmId=${currentFarmId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        plotGrid.innerHTML = ''; // 移除加载提示文字

                        if (data.plots.length === 0) {
                            plotGrid.innerHTML = `<p style="color: white; grid-column: 1/-1; text-align: center;">🚫 No plots found for this farm.</p>`;
                            return;
                        }

                        // 4. 循环渲染 3x3 矩阵中的每一个真实地块
                        data.plots.forEach(plot => {
                            // 更新右上角的 Farmer ID 信息
                            document.getElementById('navID').innerText = "ID: " + (currentFarmId.split('-').slice(0,2).join('-'));

                            const cell = document.createElement('div');
                            cell.className = 'plot-cell';
                            
                            // 点击任何一个格子，记住它的 ID，并跳转到具体的实时监控页面
                            cell.addEventListener('click', () => {
                                localStorage.setItem('current_plot_id', plot.plotId);
                                window.location.href = 'farmer_monitor.html';
                            });

                            // 接收从 Node.js 快递送来的全套真数据
                            const testCropName = plot.plotName || 'Corn';
                            const cropData = plot.iotDetails; 
                            const finalCropImg = cropIconMap[testCropName] || defaultIcon;

                            // 🚀【次级防护】：拿到后端返回的作物后，强行覆盖浏览器缓存！
                            localStorage.setItem('selected_crop_name', testCropName);
                            localStorage.setItem('selected_crop_img', finalCropImg);

                            // 联动同步修改右侧详情面板的内容
                            const panelTitle = document.getElementById('cropTitle');
                            if (panelTitle) panelTitle.innerText = testCropName;
                            
                            const panelImg = document.getElementById('panelCropImg');
                            if (panelImg) panelImg.src = finalCropImg;

                            const panelDesc = document.getElementById('panelCropDesc');
                            if (panelDesc) panelDesc.innerText = cropData.desc;

                            // 全面注射后端的 8 大动态数据指标
                            document.getElementById('panelGrowth').innerHTML = `<i class="far fa-clock"></i> Growth: ${cropData.growth}`;
                            document.getElementById('panelSunlight').innerHTML = `<i class="fas fa-sun"></i> Sunlight: ${cropData.sunlight}`;
                            document.getElementById('panelTemp').innerHTML = `<i class="fas fa-thermometer-half"></i> Temp: ${cropData.temp}`;
                            document.getElementById('panelWind').innerHTML = `<i class="fas fa-wind"></i> Wind: ${cropData.wind}`;
                            document.getElementById('panelMoisture').innerHTML = `<i class="fas fa-tint"></i> Moisture: ${cropData.moisture}`;
                            document.getElementById('panelCondition').innerHTML = `<i class="fas fa-plus"></i> Condition: ${cropData.condition}`;
                            document.getElementById('panelPest').innerHTML = `<i class="fas fa-bug"></i> Pest: ${cropData.pest}`;
                            document.getElementById('panelWeed').innerHTML = `<i class="fas fa-biohazard"></i> Weed: ${cropData.weed}`;

                            // 拼装每一个地块内部的 HTML 结构
                            cell.innerHTML = `
                                <img src="${finalCropImg}" alt="${testCropName}">
                                <span class="plot-id-tag">${plot.plotId.split('-')[2]}</span>
                            `;
                            plotGrid.appendChild(cell);
                        });

                        console.log(`📊 3x3 九宫格动态地块矩阵渲染成功！`);
                    } else {
                        alert("❌ 获取地块阵列失败: " + data.message);
                    }
                })
                .catch(err => {
                    console.error("地块 API 连接失败:", err);
                    plotGrid.innerHTML = `<p style="color: #ff9999; grid-column: 1/-1; text-align: center;">⚠️ 连接后端失败，请检查 node server.js 是否启动！</p>`;
                });
        });
    </script>
</body>
</html>
