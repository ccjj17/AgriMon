<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - AgriMon</title>
    <style>
        /* 1. 核心视觉定义 */
        :root {
            --bg-color: #76948a;      /* 页面背景 */
            --card-bg: #2d5450;       /* 卡片背景 */
            --nav-bg: #cbdad5;        /* 导航栏背景 */
            --text-white: #ffffff;
            --text-dark: #2d5450;
            --font-serif: 'Georgia', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
        }

        /* --- 1:1 导航栏复刻 --- */
        .admin-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--nav-bg);
            padding: 0 30px;
            height: 75px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .nav-left { display: flex; align-items: center; gap: 12px; }
        .logo-box { background-color: var(--highlight-yellow); width: 30px; height: 30px; border-radius: 4px; }
        .logo-text { color: var(--text-dark); font-size: 1.6rem; font-weight: bold; letter-spacing: 1px; }

        .nav-center { display: flex; gap: 40px; }
        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .nav-link.active { border-bottom: 2px solid var(--text-dark); padding-bottom: 4px; }

        /* Logo 图片样式 */
        .nav-logo-img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        /* Logo 文字样式 */
        .nav-logo-text {
            color: #2d5450;
            font-size: 1.6rem;
            font-weight: 800;
            font-family: sans-serif;
        }

        /* 用户头像图片样式 */
        .nav-user-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 0, 0, 0.05);
            display: block; /* 消除图片下方的微小间隙 */
        }   

        /* 确保父容器对齐 */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-right { display: flex; align-items: center; }
        .user-avatar { width: 45px; height: 45px; background-color: #a0b3ad; border-radius: 50%; }

        .profile-icon { width: 35px; height: 35px; background: #a0b3ad; border-radius: 50%; }

        /* 3. 主布局容器 */
        .main-container {
            padding: 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Logo 图片样式 */
        .nav-logo-img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        /* Logo 文字样式 */
        .nav-logo-text {
            color: #2d5450;
            font-size: 1.6rem;
            font-weight: 800;
            font-family: sans-serif;
        }

        /* 用户头像图片样式 */
        .nav-user-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 0, 0, 0.05);
            display: block; /* 消除图片下方的微小间隙 */
        }   

        /* 确保父容器对齐 */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 4. 统计卡片 (还原图三上方) */
        .stats-card {
            background-color: var(--card-bg);
            border-radius: 50px;
            padding: 45px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .stats-left { display: flex; align-items: center; gap: 25px; }
        .stats-left .icon { font-size: 3.5rem; opacity: 0.9; }
        .stats-left h1 { font-family: var(--font-serif); font-size: 2.5rem; line-height: 1.1; font-weight: normal; }

        .stats-right { text-align: right; }
        .big-number { font-family: var(--font-serif); font-size: 7rem; line-height: 1; }
        .unit { font-size: 1.2rem; opacity: 0.8; margin-left: 5px; }

        .info-btn { 
            position: absolute; top: 30px; right: 40px; 
            border: 1px solid rgba(255,255,255,0.4); 
            border-radius: 50%; width: 24px; height: 24px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 0.8rem; cursor: pointer;
        }

        /* 5. 用户列表卡片 (还原图三下方) */
        .list-card {
            background-color: var(--card-bg);
            border-radius: 50px;
            padding: 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .card-header .icon { font-size: 2.2rem; }
        .card-header h2 { font-family: var(--font-serif); font-size: 2.2rem; font-weight: normal; }

        /* 6. 表格样式 (填入图五数据) */
        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.1rem;
        }

        .user-table th {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            opacity: 0.6;
            font-weight: normal;
        }

        .user-table td {
            padding: 20px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .user-table tr:hover { background: rgba(255,255,255,0.03); }

        /* 状态与角色样式 */
        .role-badge { 
            background: rgba(255,255,255,0.1); 
            padding: 4px 12px; 
            border-radius: 8px; 
            font-size: 0.9rem;
        }
        
        .status-sync { color: #a0ff9a; font-size: 0.9rem; display: block; margin-top: 10px; opacity: 0.8; }

        /* 操作按钮 */
        .action-btns a { text-decoration: none; font-size: 0.9rem; margin-right: 15px; }
        .edit-btn { color: #ffd700; }
        .del-btn { color: #ff6b6b; }

    </style>
</head>
<body>

    <nav class="admin-nav">
        <div class="nav-left" onclick="location.href='admin_about.html'">
            <img src="assets/images/logo_agrimon.jpeg" alt="Logo" class="nav-logo-img">
        </div>
        <div class="nav-center">
            <a href="admin_dashboard.html" class="nav-link active">User Management</a>
            <a href="admin_farm.html" class="nav-link">Farm Management</a>
            <a href="admin_regions_select.html" class="nav-link">Monitoring & Data ▴</a>
        </div>
        <div class="nav-right" onclick="location.href='admin_profile.html'">
            <div class="user-meta" style="text-align: right; margin-right: 10px;">
            </div>
            <img src="assets/images/user_image.jpg" class="nav-user-img">
        </div>
    </nav>

    <main class="main-container">

        <section class="stats-card">
            <div class="info-btn">i</div>
            <div class="stats-left">
                <span class="icon">👥</span>
                <h1>No. of<br>Users</h1>
            </div>
            <div class="stats-right">
                <span class="big-number">2</span>
                <span class="unit">persons</span>
            </div>
        </section>

        <section class="list-card">
            <div class="card-header">
                <span class="icon">📋</span>
                <h2>Users List</h2>
            </div>

            <table class="user-table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>ADM-002</td>
                        <td>(Admin User)</td>
                        <td><span class="role-badge">Admin</span></td>
                        <td class="action-btns">
                            <a href="#" class="edit-btn">Edit</a>
                            <a href="#" class="del-btn">Remove</a>
                        </td>
                    </tr>
                    <tr>
                        <td>FAR-001</td>
                        <td>wfevj</td>
                        <td><span class="role-badge">Farmer</span></td>
                        <td class="action-btns">
                            <a href="#" class="edit-btn">Edit</a>
                            <a href="#" class="del-btn">Remove</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <span class="status-sync">All data pulled from Central Database.</span>
        </section>

    </main>

</body>
</html>
