<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Charts - AgriMon</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #76948a;      
            --card-bg: #2d5450;       
            --nav-bg: #cbdad5;        
            --text-dark: #2d5450;
            --text-white: #ffffff;
            --highlight-yellow: #ffd700;
            --accent-green: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: auto;
            overflow-y: auto;
        }

        .dashboard-container {
            display: flex; flex-direction: column;
            width: 100%; min-width: 1000px;
        }

        /* --- 1:1 导航栏复刻 --- */
        .admin-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--nav-bg);
            padding: 0 30px;
            height: 75px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .nav-left { display: flex; align-items: center; gap: 12px; }
        .logo-box { background-color: var(--highlight-yellow); width: 30px; height: 30px; border-radius: 4px; }
        .logo-text { color: var(--text-dark); font-size: 1.6rem; font-weight: bold; letter-spacing: 1px; }

        .nav-center { display: flex; gap: 40px; }
        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .nav-link.active { border-bottom: 2px solid var(--text-dark); padding-bottom: 4px; }

        /* Logo 图片样式 */
        .nav-logo-img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        /* Logo 文字样式 */
        .nav-logo-text {
            color: #2d5450;
            font-size: 1.6rem;
            font-weight: 800;
            font-family: sans-serif;
        }

        /* 用户头像图片样式 */
        .nav-user-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 0, 0, 0.05);
            display: block; /* 消除图片下方的微小间隙 */
        }   

        /* 确保父容器对齐 */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-right { display: flex; align-items: center; }
        .user-avatar { width: 45px; height: 45px; background-color: #a0b3ad; border-radius: 50%; }


        /* 外层包装盒：设为纵向排列 */
        .content-wrapper {
            padding: 40px 80px; /* 增加边距确保不贴边 */
            display: flex;
            flex-direction: column; /* 纵向排列：按钮在上，卡片在下 */
            align-items: center;    /* 水平居中 */
            width: 100%;
        }

        /* 确保主卡片不再包含按钮的空间 */
        .chart-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--card-bg);
            border-radius: 40px;
            padding: 40px 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .header-area {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }
        .header-left h2 { font-size: 2.4rem; color: white; font-weight: 600; }

        /* 按钮样式：确保它是显眼的黄色 */
        .back-btn {
            text-decoration: none;
            color: var(--highlight-yellow) !important;
            font-weight: bold;
            font-size: 1rem;
            opacity: 1 !important;
            transition: 0.3s;
        }

        /* 按钮所在的这一横条 */
        .top-action-bar {
            width: 100%;
            max-width: 1100px; /* 与下方卡片的最大宽度保持一致 */
            margin-bottom: 15px; /* 与下方卡片的间距 */
            display: flex;
            justify-content: flex-start; /* 靠左对齐 */
        }

        .back-btn:hover {
            color: white !important;
        }

        .chart-section { margin-bottom: 50px; }
        .chart-title {
            color: white; font-size: 1.3rem; font-weight: 600; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .chart-title::before {
            content: ""; display: inline-block; width: 4px; height: 18px; 
            background: var(--highlight-yellow); border-radius: 2px;
        }

        .chart-box {
            width: 100%; background: #244642; border-radius: 30px;
            padding: 30px; border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas { width: 100% !important; height: 380px !important; }
    </style>
</head>
<body>

<nav class="admin-nav">
        <div class="nav-left" onclick="location.href='admin_about.html'">
            <img src="assets/images/logo_agrimon.jpeg" alt="Logo" class="nav-logo-img">
        </div>
        <div class="nav-center">
            <a href="admin_users.html" class="nav-link">User Management</a>
            <a href="admin_farm.html" class="nav-link">Farm Management</a>
            <a href="admin_regions_select.html" class="nav-link active">Monitoring & Data ▴</a>
        </div>
        <div class="nav-right" onclick="location.href='admin_profile.html'">
            <div class="user-meta" style="text-align: right; margin-right: 10px;">
            </div>
            <img src="assets/images/user_image.jpg" class="nav-user-img">
        </div>
    </nav>

        <div class="content-wrapper">
            <div class="top-action-bar">
                <a href="admin_regions_detail.html" id="backLink" class="back-btn">← Back to Details</a>
            </div>
            <main class="chart-container">
                <div class="header-area">
                    <div class="header-left">
                        <h2 id="regionTitle">Johor Analysis</h2>
                    </div>
                    
                </div>

                <div class="chart-section">
                    <span class="chart-title">24H TEMP TREND (°C) - [LOCAL SYNC]</span>
                    <div class="chart-box">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>

                <div class="chart-section" style="margin-bottom: 0;">
                    <span class="chart-title">WEEKLY WATER USAGE (Litre)</span>
                    <div class="chart-box">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // 1. 数据准备
        const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
        const chartData = [26.5, 28.2, 27.8, 30.5, 29.1, 31.8];

        // 2. 渲染折线图 (Line Chart)
        new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Avg Temperature',
                    data: chartData,
                    borderColor: '#ffd700',
                    backgroundColor: 'rgba(255, 215, 0, 0.15)',
                    borderWidth: 4,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#ffd700'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff', font: { weight: 'bold' } } } },
                scales: {
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#fff' } },
                    x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#fff' } }
                }
            }
        });

        // 3. 渲染横向条形图 (Horizontal Bar Chart)
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Monthly Data Value',
                    data: chartData,
                    backgroundColor: '#4ade80',
                    hoverBackgroundColor: '#ffd700',
                    borderRadius: 10,
                    barThickness: 30
                }]
            },
            options: {
                indexAxis: 'y', // 【核心修改：改为横向】
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { labels: { color: '#fff', font: { weight: 'bold' } } } 
                },
                scales: {
                    x: { // 数值轴
                        beginAtZero: true,
                        grid: { color: 'rgba(255,255,255,0.1)' },
                        ticks: { color: '#fff' }
                    },
                    y: { // 标签轴
                        grid: { display: false },
                        ticks: { color: '#fff', font: { weight: 'bold' } }
                    }
                }
            }
        });

        // 4. 处理地区名称
        const reg = new URLSearchParams(window.location.search).get('reg') || 'Johor';
        document.getElementById('regionTitle').innerText = reg + ' Analysis';
    </script>
</body>
</html>
