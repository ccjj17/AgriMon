<!DOCTYPE html>
<html lang="zh-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AgriMon</title>
    <style>
        /* 全局样式 - 还原图一配色 */
        :root {
            --bg-color: #76948a;      /* 背景莫兰迪绿 */
            --card-bg: #2d5450;       /* 卡片深绿色 */
            --nav-bg: #cbdad5;        /* 导航栏浅色 */
            --text-white: #ffffff;
            --text-dark: #2d5450;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
        }

        /* --- 1:1 导航栏复刻 --- */
        .admin-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--nav-bg);
            padding: 0 30px;
            height: 75px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .nav-left { display: flex; align-items: center; gap: 12px; }
        .logo-box { background-color: var(--highlight-yellow); width: 30px; height: 30px; border-radius: 4px; }
        .logo-text { color: var(--text-dark); font-size: 1.6rem; font-weight: bold; letter-spacing: 1px; }

        .nav-center { display: flex; gap: 40px; }
        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .nav-link.active { border-bottom: 2px solid var(--text-dark); padding-bottom: 4px; }

        /* Logo 图片样式 */
        .nav-logo-img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        /* Logo 文字样式 */
        .nav-logo-text {
            color: #2d5450;
            font-size: 1.6rem;
            font-weight: 800;
            font-family: sans-serif;
        }

        /* 用户头像图片样式 */
        .nav-user-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 0, 0, 0.05);
            display: block; /* 消除图片下方的微小间隙 */
        }   

        /* 确保父容器对齐 */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-right { display: flex; align-items: center; }
        .user-avatar { width: 45px; height: 45px; background-color: #a0b3ad; border-radius: 50%; }


        .profile-icon {
            width: 35px;
            height: 35px;
            background-color: #a0b3ad;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 主体布局 */
        .dashboard-container {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* 卡片基础样式 - 关键的大圆角 */
        .card {
            background-color: var(--card-bg);
            border-radius: 45px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header h2 {
            margin: 0;
            font-family: 'Georgia', serif; /* 还原图一的衬线体 */
            font-size: 1.8rem;
            font-weight: normal;
        }

        .icon {
            margin-right: 15px;
            font-size: 1.5rem;
        }

        /* Active Farmers 区块 */
        .active-farmers-card {
            flex: 1;
            text-align: center;
        }

        .big-number {
            font-size: 7rem;
            font-family: 'Georgia', serif;
            display: block;
            line-height: 1;
            margin-top: 20px;
        }

        .unit {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Data Summary 区块 - 填入图二数据 */
        .data-summary-card {
            flex: 2;
        }

        .data-list {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }

        .data-list li {
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .data-label { opacity: 0.8; }
        .data-value { font-weight: bold; }

        /* Farm Overview 区块 */
        .farm-overview-card {
            width: 100%;
        }

        .status-bar {
            background-color: rgba(0,0,0,0.2);
            padding: 15px 25px;
            border-radius: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            color: #a0ff9a; /* 提示信息用淡绿色 */
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .top-row { flex-direction: column; }
        }

        /* 全局重置，确保一致性 */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* 全局背景色 (保留莫兰迪绿) */
body {
    background-color: #76948a;
    color: white;
    font-family: 'Segoe UI', serif;
}

/* 定义网格布局 */
.dashboard-grid {
    display: grid;
    /* 定义两列：左窄右宽 (例如 1:2.3) */
    grid-template-columns: 1fr 2.3fr;
    /* 强制第一行（卡片）具有相同的高度 */
    grid-auto-rows: minmax(auto, 1fr);
    /* 设置卡片之间的固定间距 */
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
}

/* 关键：确保第 3 个卡片 (Farm Overview) 跨越整行 */
.farm-overview {
    grid-column: 1 / -1; /* 跨越所有网格列 */
}

/* 样式基础 (保留深绿色卡片) */
.card {
    background-color: #2d5450;
    border-radius: 40px; /* 大圆角 */
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* 确保卡片内部内容分布对齐 */
}

/* 卡片头部样式 (保留衬线体) */
.card-header {
    font-family: 'Georgia', serif;
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

.card-header i { margin-right: 10px; }

/* 内容区域样式确保列表内容对齐 */
.data-list {
    list-style: none;
    flex-grow: 1; /* 使列表区域占据卡片剩余空间 */
    display: flex;
    flex-direction: column;
    justify-content: space-around; /* 垂直居中分布列表项 */
}

.data-list li {
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 10px 0;
    display: flex;
    justify-content: space-between;
}
    </style>
</head>
<body>

<nav class="admin-nav">
        <div class="nav-left" onclick="location.href='admin_about.html'">
            <img src="assets/images/logo_agrimon.jpeg" alt="Logo" class="nav-logo-img">
        </div>
        <div class="nav-center">
            <a href="admin_users.html" class="nav-link">User Management</a>
            <a href="admin_farm.html" class="nav-link">Farm Management</a>
            <a href="admin_regions_select.html" class="nav-link">Monitoring & Data ▴</a>
        </div>
        <div class="nav-right" onclick="location.href='admin_profile.html'">
            <div class="user-meta" style="text-align: right; margin-right: 10px;">
            </div>
            <img src="assets/images/user_image.jpg" class="nav-user-img">
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="top-row">
            <section class="card active-farmers-card">
                <div class="card-header">
                    <span class="icon">👤</span>
                    <h2>Active Farmers</h2>
                </div>
                <div class="card-body">
                    <span class="big-number">1</span>
                    <span class="unit">persons</span>
                </div>
            </section>

            <section class="card data-summary-card">
                <div class="card-header">
                    <span class="icon">📊</span>
                    <h2>Data Summary</h2>
                </div>
                <ul class="data-list">
                    <li><span class="data-label">System Health :</span> <span class="data-value">98.5%</span></li>
                    <li><span class="data-label">Total Users :</span> <span class="data-value">2</span></li>
                    <li><span class="data-label">Total Farms :</span> <span class="data-value">12</span></li>
                    <li><span class="data-label">Most Planted :</span> <span class="data-value">Corn</span></li>
                </ul>
            </section>
        </div>

        <section class="card farm-overview-card">
            <div class="card-header">
                <span class="icon">🏠</span>
                <h2>Farm Overview</h2>
            </div>
            <div class="status-bar">
                [STATUS] All nodes responding. No critical errors.
            </div>
            <div style="margin-top: 40px; text-align: center; opacity: 0.5;">
                <p>Connecting...</p>
                </div>
        </section>
    </main>

</body>
</html>
